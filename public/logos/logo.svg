<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Load the Google Fonts inside the SVG itself to ensure it renders correctly everywhere -->
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Outfit:wght@800&amp;display=swap');
      .text-mymob {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 36px;
        fill: #FFFFFF;
      }
      .text-pay {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 36px;
        fill: #3B82F6;
      }
    </style>
  </defs>
  
  <text x="2" y="42" letter-spacing="0">
    <tspan class="text-mymob">MyMob</tspan>
    <tspan class="text-pay" dx="3">Pay</tspan>
  </text>
</svg>
