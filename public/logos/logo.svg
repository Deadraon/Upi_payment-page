<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="paydriftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
  </defs>
  <!-- Sleek vector emblem forming PayDrift's dynamic P-D double loop and wave -->
  <!-- P curve loop -->
  <path d="M 40 85 L 40 35 C 40 22, 65 20, 65 38 C 65 55, 40 55, 40 55" 
        fill="none" stroke="url(#paydriftGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <!-- D curve loop -->
  <path d="M 65 55 C 65 48, 90 50, 90 68 C 90 86, 65 85, 65 85 L 65 85" 
        fill="none" stroke="url(#paydriftGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Sweeping dynamic drift line -->
  <path d="M 28 92 Q 65 92 92 74" 
        fill="none" stroke="url(#paydriftGrad)" stroke-width="7" stroke-linecap="round" />
</svg>
