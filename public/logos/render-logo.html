<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyMobPay Logo Generator</title>
  <style>
    body {
      background: #0B192C;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #0F1E36;
      border: 1px solid #1D2D44;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
    }
    .logo-container {
      background: #07111F;
      padding: 30px 20px;
      border-radius: 12px;
      margin: 24px 0;
      border: 1px dashed #1D2D44;
    }
    button {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #2563EB;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      line-height: 1.5;
      margin: 8px 0 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin: 0;">MyMobPay Logo Exporter</h2>
    <p>Render the official live wordmark logo to a high-resolution transparent PNG image.</p>
    
    <div class="logo-container">
      <svg id="mymobpay-svg" width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style type="text/css">
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Outfit:wght@500&amp;display=swap');
            .text-mymob {
              font-family: 'Orbitron', sans-serif;
              font-weight: 800;
              font-size: 38px;
              fill: #FFFFFF;
            }
            .text-sub {
              font-family: 'Outfit', sans-serif;
              font-weight: 500;
              font-size: 34px;
              fill: #FFFFFF;
            }
            .text-pay {
              font-family: 'Orbitron', sans-serif;
              font-weight: 900;
              font-style: italic;
              font-size: 36px;
              fill: #3B82F6;
            }
          </style>
        </defs>
        <text x="2" y="42" letter-spacing="0">
          <tspan class="text-mymob">M</tspan>
          <tspan class="text-sub" dx="1">y</tspan>
          <tspan class="text-mymob" dx="2">M</tspan>
          <tspan class="text-sub" dx="1">ob</tspan>
          <tspan class="text-pay" dx="3">Pay</tspan>
        </text>
      </svg>
    </div>
    
    <button onclick="downloadPNG()">Download PNG (Transparent)</button>
  </div>

  <script>
    function downloadPNG() {
      const svgElement = document.getElementById('mymobpay-svg');
      const svgString = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);
      
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1120; // 4x scale for high-res
        canvas.height = 240;
        const context = canvas.getContext('2d');
        context.drawImage(image, 0, 0, 1120, 240);
        
        const pngURL = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngURL;
        downloadLink.download = 'mymobpay_logo.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };
      image.src = blobURL;
    }
  </script>
</body>
</html>
